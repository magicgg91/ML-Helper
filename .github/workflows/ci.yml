name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
  packages: write
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm test
      - name: Verify migrations
        run: |
          pnpm prisma migrate deploy
        env:
          DATABASE_URL: file:./startup-test.db
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/magicgg91/ml-helper:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
      - name: Verify container startup
        run: |
          mkdir -p "$RUNNER_TEMP/ml-helper-data"
          docker run --rm \
            --mount type=bind,src="$RUNNER_TEMP/ml-helper-data",dst=/app/data \
            -e DATABASE_URL=file:/app/data/ml-helper.db \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e NEXTAUTH_SECRET=container-startup-test-secret \
            ghcr.io/magicgg91/ml-helper:${{ github.ref_name == 'main' && 'latest' || 'dev' }} \
            node -e "console.log('Container startup verified')"
      - name: Verify Docker Compose health
        run: |
          touch .env
          docker compose up -d --pull never --wait --wait-timeout 180
          docker compose ps
          container_id="$(docker compose ps -q app)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes
      - name: Report successful Docker Compose health
        if: success()
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data '{"state":"success","context":"docker-compose/health","description":"Docker Compose app container is healthy"}'
      - name: Report failed Docker Compose health
        if: failure()
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data '{"state":"failure","context":"docker-compose/health","description":"Docker Compose app container did not become healthy"}'
      - name: Push image
        run: docker push ghcr.io/magicgg91/ml-helper:${{ github.ref_name == 'main' && 'latest' || 'dev' }}

